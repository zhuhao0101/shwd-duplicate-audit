# Training protocol used for every reported run (Ultralytics 8.4)
model: yolov8n.pt   # yolov8s.pt / rtdetr-l.pt for Section 4.9
epochs: 40
imgsz: 640
batch: 16          # 8 for rtdetr-l
pretrained: true
deterministic: false
patience: 50
seeds: [0, 1, 2]
val: false         # no validation pass on evaluation data; data file's val entry is a 32-image stub of training images
weights_evaluated: last.pt   # final epoch; no checkpoint selection
evaluation: {imgsz: 640, batch: 1, split: test, metrics: [mAP50, mAP50_95, per-class AP50]}
